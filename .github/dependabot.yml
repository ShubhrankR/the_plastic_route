version: 2
updates:
  # Maintain dependencies for npm packages
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 3
    labels:
      - 'dependencies'
    ignore:
      # Angular 22.x only supports TypeScript >=6.0 <6.1;
      # ignore TS major bumps until Angular catches up.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      angular:
        patterns:
          - '@angular*'
          - 'zone.js'
          - 'rxjs'
      typescript:
        patterns:
          - 'typescript'
      dependencies:
        patterns:
          - '*'

  # Maintain dependencies for GitHub Actions workflows
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 2
    labels:
      - 'dependencies'
    groups:
      actions:
        patterns:
          - '*'
