name: 🐛 Bug Report
description: Report an issue or unexpected behavior in The Plastic Route application.
title: '[Bug]: '
labels: ['bug', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        ### 🐛 Bug Report
        Thank you for reporting a bug! Please provide clear reproduction steps below.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: 'When calculating interest-free window for card X, the calculation...'
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce the issue step-by-step?
      placeholder: |
        1. Go to '/#/portfolio'
        2. Click 'Add Card from Catalog'
        3. Select '...'
        4. See error...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Mobile Browser (iOS)
        - Mobile Browser (Android)
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: 'e.g., macOS Sonoma, Windows 11, Ubuntu 24.04, iOS 18'
    validations:
      required: false
