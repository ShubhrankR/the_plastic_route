name: 💡 Feature Request
description: Propose a new feature, UX improvement, or enhancement for The Plastic Route.
title: '[Feature]: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        ### 💡 Feature Request & Improvement Proposal
        Have an idea to make **The Plastic Route** better? We'd love to hear it!

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or limitation is.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
      placeholder: 'Add an export/import button that...'
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      placeholder: "Any alternative solutions or features you've considered."
    validations:
      required: false
