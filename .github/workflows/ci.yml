name: Continuous Integration & Security Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Code Quality, Schema & Security Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Code Formatting
        run: npm run format:check

      - name: Validate Master Card Catalog Schema & Integrity
        run: npm run cards:validate

      - name: Verify Zero-Telemetry Privacy Architecture
        run: |
          echo "Auditing application source for unauthorized network telemetry..."
          if git grep -nE "fetch\(|XMLHttpRequest|navigator\.sendBeacon" src/app/; then
            echo "❌ CRITICAL: Unauthorized outbound network calls detected in src/app/! The Plastic Route strictly enforces zero-telemetry client-side privacy."
            exit 1
          fi
          echo "✅ Zero outbound network telemetry verified."

      - name: Run Automated Unit Tests (Vitest)
        run: npm test

      - name: Verify Angular Production Compilation
        run: npm run build

      - name: Audit Dependencies for High-Severity Vulnerabilities
        run: npm audit --audit-level=high
