name: Sync Master Credit Cards Catalog

on:
  schedule:
    # Runs every Monday at 04:00 UTC
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason or notes for manual catalog sync'
        required: false
        default: 'Manual trigger via GitHub Actions'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-and-validate:
    name: Ingest Card Data & Verify Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Master Catalog Sync Script
        run: npm run cards:sync

      - name: Verify Angular Compilation
        run: npm run build

      - name: Create Pull Request with Updates
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(data): automated master credit card catalog sync'
          title: '🤖 Automated Credit Card Catalog Update'
          body: |
            ## Automated Card Database Update

            This automated Pull Request was generated by GitHub Actions (`sync-cards.yml`).

            ### Verification
            - Master catalog in `src/app/core/data/cards.json` updated & schema validated.
            - `owner_portfolio.json` verified untouched.
            - Angular 22 production build succeeded with 0 errors.
          branch: bot/card-catalog-sync
          base: main
          delete-branch: true
          labels: |
            automated-pr
            dataset-sync
