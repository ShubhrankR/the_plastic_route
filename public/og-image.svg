<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#071913" />
    </linearGradient>
    <radialGradient id="emeraldGlow" cx="80%" cy="25%" r="60%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.65" />
      <stop offset="50%" stop-color="#047857" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0B0F19" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="goldGlow" cx="20%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#0B0F19" stop-opacity="0" />
    </radialGradient>

    <!-- Card 1 (Back - Royal Obsidian) -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Card 2 (Middle - Emerald Forest) -->
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#047857" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.95" />
    </linearGradient>

    <!-- Card 3 (Front - Deep Mint Glass) -->
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#059669" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0.95" />
    </linearGradient>

    <!-- Chip Gold Gradient -->
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Text Gold Gradient -->
    <linearGradient id="textGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowCard" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="glowPath" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#emeraldGlow)" />
  <rect width="1200" height="630" fill="url(#goldGlow)" />

  <!-- Subtle Ambient Grid Lines -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- LEFT BRANDING & VALUE PROPOSITION -->
  <g transform="translate(80, 80)">
    <!-- Logo Badge -->
    <g transform="translate(0, 0)">
      <rect width="52" height="52" rx="14" fill="#064e3b" stroke="#10b981" stroke-width="2" />
      <!-- Mini logo inside -->
      <g transform="translate(6, 6) scale(0.4)">
        <rect x="30" y="20" width="60" height="40" rx="5" fill="#064e3b"/>
        <rect x="20" y="30" width="60" height="40" rx="5" fill="#047857"/>
        <rect x="10" y="40" width="60" height="40" rx="5" fill="#10b981"/>
        <path d="M 25 60 C 40 60, 50 20, 80 30" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round"/>
        <path d="M 70 23 L 82 30 L 73 39" fill="none" stroke="#f59e0b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <text x="68" y="34" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="24" fill="#ffffff" letter-spacing="0.5">THE PLASTIC ROUTE</text>
    </g>

    <!-- Main Headline -->
    <text x="0" y="130" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="52" fill="#ffffff" letter-spacing="-1">
      Swipe Smart.
    </text>
    <text x="0" y="190" font-family="'Inter', -apple-system, sans-serif" font-weight="800" font-size="52" fill="url(#textGoldGrad)" letter-spacing="-1">
      Maximize Every Rupee.
    </text>

    <!-- Subtitle -->
    <text x="0" y="246" font-family="'Inter', -apple-system, sans-serif" font-weight="400" font-size="20" fill="#94a3b8" width="520">
      Privacy-first credit card spend optimizer &amp; billing cycle tracker.
    </text>
    <text x="0" y="276" font-family="'Inter', -apple-system, sans-serif" font-weight="400" font-size="20" fill="#94a3b8" width="520">
      Compare 180+ Indian cards. Zero telemetry. 100% client-side.
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 330)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="180" height="38" rx="19" fill="#064e3b" fill-opacity="0.6" stroke="#10b981" stroke-width="1.5" />
        <text x="20" y="24" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="14" fill="#a7f3d0">🛡️ Zero-Backend</text>
      </g>

      <!-- Pill 2 -->
      <g transform="translate(195, 0)">
        <rect width="175" height="38" rx="19" fill="#064e3b" fill-opacity="0.6" stroke="#10b981" stroke-width="1.5" />
        <text x="20" y="24" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="14" fill="#a7f3d0">💳 180+ Cards</text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(385, 0)">
        <rect width="190" height="38" rx="19" fill="#064e3b" fill-opacity="0.6" stroke="#f59e0b" stroke-width="1.5" />
        <text x="20" y="24" font-family="'Inter', -apple-system, sans-serif" font-weight="600" font-size="14" fill="#fde68a">⚡ Reward Optimizer</text>
      </g>
    </g>

    <!-- URL footer badge -->
    <g transform="translate(0, 420)">
      <rect width="360" height="32" rx="8" fill="#1e293b" fill-opacity="0.7" stroke="#334155" stroke-width="1" />
      <circle cx="16" cy="16" r="5" fill="#10b981" />
      <text x="32" y="21" font-family="'Inter', -apple-system, monospace" font-weight="500" font-size="13" fill="#cbd5e1">shubhrankr.github.io/the_plastic_route</text>
    </g>
  </g>

  <!-- RIGHT CARD GRAPHICS SHOWCASE -->
  <g transform="translate(720, 110)">
    <!-- Back Card (Obsidian) -->
    <g transform="rotate(-6, 200, 150)" filter="url(#shadowCard)">
      <rect x="20" y="20" width="360" height="225" rx="16" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.5" />
      <rect x="50" y="60" width="46" height="36" rx="6" fill="url(#chipGrad)" />
      <text x="50" y="165" font-family="'Inter', monospace" font-size="16" fill="#64748b" letter-spacing="4">•••• •••• •••• 8821</text>
      <text x="50" y="210" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#94a3b8" letter-spacing="1.5">INFINIA METAL</text>
      <text x="300" y="210" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#f59e0b">5X REWARD</text>
    </g>

    <!-- Middle Card (Emerald) -->
    <g transform="translate(20, 90) rotate(4, 200, 150)" filter="url(#shadowCard)">
      <rect x="20" y="20" width="360" height="225" rx="16" fill="url(#cardGrad2)" stroke="#10b981" stroke-width="2" />
      <rect x="50" y="60" width="46" height="36" rx="6" fill="url(#chipGrad)" />
      <circle cx="330" cy="65" r="14" fill="#f59e0b" fill-opacity="0.8" />
      <circle cx="346" cy="65" r="14" fill="#ef4444" fill-opacity="0.8" />
      <text x="50" y="165" font-family="'Inter', monospace" font-size="16" fill="#a7f3d0" letter-spacing="4">•••• •••• •••• 4092</text>
      <text x="50" y="210" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#d1fae5" letter-spacing="1.5">SAPPHIRO DUAL</text>
      <text x="270" y="210" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#fde68a">50 DAYS CYCLE</text>
    </g>

    <!-- Front Card (Mint Hero) -->
    <g transform="translate(50, 190) rotate(-2, 200, 150)" filter="url(#shadowCard)">
      <rect x="20" y="20" width="360" height="225" rx="16" fill="url(#cardGrad3)" stroke="#34d399" stroke-width="2.5" />
      <rect x="50" y="60" width="46" height="36" rx="6" fill="url(#chipGrad)" />
      <!-- Wireless icon -->
      <path d="M 115 70 A 10 10 0 0 1 115 86 M 122 64 A 18 18 0 0 1 122 92 M 129 58 A 26 26 0 0 1 129 98" fill="none" stroke="#d1fae5" stroke-width="2" stroke-linecap="round" />
      <text x="50" y="165" font-family="'Inter', monospace" font-size="16" fill="#ffffff" font-weight="600" letter-spacing="4">•••• •••• •••• 1024</text>
      <text x="50" y="210" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#ffffff" letter-spacing="1.5">MAGNUS BURGUNDY</text>
      <text x="270" y="210" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#fde68a">MAX POINTS</text>
    </g>

    <!-- Golden Dynamic Route Path -->
    <g filter="url(#glowPath)">
      <path d="M 0 320 C 120 220, 200 80, 360 120 C 440 140, 380 320, 430 400" fill="none" stroke="#f59e0b" stroke-width="7" stroke-linecap="round" stroke-dasharray="8 6" />
      <!-- Arrowhead -->
      <polygon points="430,400 415,385 435,380" fill="#f59e0b" transform="rotate(30, 430, 400)" />
      <!-- Pulsing Node Dots -->
      <circle cx="160" cy="180" r="7" fill="#fbbf24" stroke="#ffffff" stroke-width="2" />
      <circle cx="360" cy="120" r="9" fill="#fbbf24" stroke="#ffffff" stroke-width="2.5" />
    </g>
  </g>
</svg>