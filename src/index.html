<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>The Plastic Route | Credit Card Optimization</title>
    <meta
      name="description"
      content="Privacy-first credit card spend optimizer and billing cycle tracker. Find the best card for every transaction."
    />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#064e3b" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg-app: #f0fdf4;
        --surface-card: #ffffff;
        --color-primary: #064e3b;
        --color-secondary: #047857;
        --color-mint: #10b981;
        --color-gold: #f59e0b;
        --border-subtle: #d1fae5;
        --text-main: #064e3b;
        --text-muted: #64748b;
      }

      body {
        background-color: var(--bg-app);
        color: var(--text-main);
      }

      h2,
      .fw-bold {
        color: var(--color-primary);
      }

      .nav-tabs .nav-link {
        color: var(--text-muted);
      }

      .nav-tabs .nav-link.active {
        color: var(--color-primary) !important;
        font-weight: 700;
        border-color: var(--border-subtle) var(--border-subtle) #ffffff !important;
      }

      .btn-dark {
        background-color: var(--color-primary) !important;
        border-color: var(--color-primary) !important;
        color: #ffffff !important;
        transition: background-color 0.2s ease;
      }

      .btn-dark:hover {
        background-color: var(--color-secondary) !important;
        border-color: var(--color-secondary) !important;
      }

      .card {
        border: 1px solid var(--border-subtle) !important;
      }

      .form-select:focus,
      .form-control:focus {
        border-color: var(--color-mint) !important;
        box-shadow: 0 0 0 0.25rem rgba(16, 185, 129, 0.25) !important;
      }

      .badge.bg-success {
        background-color: var(--color-mint) !important;
      }

      .badge.bg-warning {
        background-color: var(--color-gold) !important;
        color: #ffffff !important;
      }
    </style>
  </head>
  <body data-theme="dark">
    <app-root></app-root>
  </body>
</html>
