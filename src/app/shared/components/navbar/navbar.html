<nav class="navbar">
  <div class="container navbar-inner">
    <a routerLink="/home" class="brand text-gradient">
      <img src="the_plastic_route.svg" alt="The Plastic Route Logo" class="brand-logo" width="36" height="36">
      <span>The Plastic Route.</span>
    </a>
    
    @if (hasCompletedOnboarding()) {
      <div class="nav-links">
        <a routerLink="/home" routerLinkActive="active" class="nav-link">🏠 Home</a>
        <a routerLink="/optimizer" routerLinkActive="active" class="nav-link">💳 Optimizer</a>
        <a routerLink="/tracker" routerLinkActive="active" class="nav-link">📅 Tracker</a>
        <a routerLink="/portfolio" routerLinkActive="active" class="nav-link">
          💼 Portfolio
          @if (isExploreMode()) {
            <span class="nav-badge badge-warning">Demo</span>
          } @else if (userCardCount() > 0) {
            <span class="nav-badge badge-success">{{ userCardCount() }}</span>
          }
        </a>
      </div>
    }

    <div class="navbar-actions">
      <button class="btn btn-ghost" (click)="toggleTheme()">
        {{ theme() === 'dark' ? '☀️ Light Mode' : '🌙 Dark Mode' }}
      </button>
    </div>
  </div>
</nav>
